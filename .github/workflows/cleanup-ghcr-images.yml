name: Cleanup GHCR Images

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crawlix-next
  KEEP_TAGS: main,latest
  KEEP_LAST_N: 2

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        service: [api, worker]

    steps:
      - name: Delete container versions safely
        uses: actions/github-script@v8
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: crawlix-next-${{ matrix.service }}
          KEEP_TAGS: ${{ env.KEEP_TAGS }}
          KEEP_LAST_N: ${{ env.KEEP_LAST_N }}
        with:
          script: |
            const owner = process.env.OWNER;
            const packageName = process.env.PACKAGE_NAME;
            const keepTags = new Set(
              (process.env.KEEP_TAGS || "")
                .split(",")
                .map(t => t.trim())
                .filter(Boolean)
            );
            const KEEP_LAST_N = parseInt(process.env.KEEP_LAST_N || "5");

            const versions = await github.paginate(
              "GET /users/{username}/packages/{package_type}/{package_name}/versions",
              {
                username: owner,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              }
            );

            versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const recentVersions = new Set(
              versions.slice(0, KEEP_LAST_N).map(v => v.id)
            );

            let kept = 0;
            let deleted = 0;

            for (const version of versions) {
              const tags = version.metadata?.container?.tags || [];

              if (!tags || tags.length === 0) {
                kept++;
                continue;
              }

              if (recentVersions.has(version.id)) {
                kept++;
                continue;
              }

              const hasKeepTag = tags.some(tag => keepTags.has(tag));

              if (hasKeepTag) {
                kept++;
                continue;
              }

              await github.request(
                "DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}",
                {
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: version.id,
                }
              );

              deleted++;
            }

            core.notice(`[${packageName}] kept=${kept}, deleted=${deleted}`);
